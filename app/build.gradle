plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rocket.cheat'
    compileSdk 34

    defaultConfig {
        applicationId "com.rocket.cheat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Поддержка 64 и 32 бит
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}